<text x="32" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">MAP A. Every block between two neighbouring streets or avenues is the same length,</text>
<text x="32" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">including the block that crosses the river. Arrows show the only legal direction on a</text>
<text x="32" y="544" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">one-way road. Two-way roads have no arrows. The red X marks a closed block. Only 2nd Ave</text>
<text x="32" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">and 4th Ave have bridges; 1st Ave and 3rd Ave stop at the river (DEAD END).</text>
